<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07091a">
  <title>IIT Madras Resource Page</title>
  <link rel="icon" type="image/png" href="image/tab.png">
  
  <!-- Preload video immediately with high priority to prevent initial stutter -->
  <link rel="preload" href="gemini_generated_video_8c620d54.mp4" as="video" type="video/mp4">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/df9d548cf6.js" crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #07091a;
      color: #fff;
      position: relative;
    }

    /* =========================================================
       INTRO VIDEO OVERLAY - HARDWARE ACCELERATED & BUFFER SAFE
       ========================================================= */
    #intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 99999;
      background: #07091a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #intro-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Smooth loading spinner while phone buffers initial frames */
    #video-loader {
      position: absolute;
      z-index: 2;
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #2ecc71;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transition: opacity 0.3s ease;
    }
    #video-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: center;
      display: block;
      z-index: 1;
      /* Force mobile GPU hardware acceleration for stutter-free playback */
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    /* Large, Easy-to-See Skip Intro Button */
    #skip-intro {
      position: absolute;
      right: clamp(16px, 4vw, 32px);
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      z-index: 10;
      border: 2px solid #ffffff;
      border-radius: 14px;
      padding: clamp(12px, 3vw, 16px) clamp(22px, 5vw, 32px);
      background: rgba(255, 255, 255, 0.92);
      color: #07091a;
      font-size: clamp(17px, 4vw, 22px);
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65), 0 0 20px rgba(255, 255, 255, 0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #skip-intro:hover, #skip-intro:active {
      transform: scale(1.07);
      background: #2ecc71;
      color: #fff;
      border-color: #fff;
    }

    /* =========================================================
       MAIN PAGE STYLES
       ========================================================= */
    #starfield, .nebula { position: fixed; inset: 0; pointer-events: none; }
    #starfield { z-index: 1; }
    .nebula {
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 70%, rgba(111,92,255,.28), transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 30%, rgba(52,152,219,.18), transparent 65%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(155,89,182,.22), transparent 60%);
      animation: nebulaPulse 8s ease-in-out infinite alternate;
    }
    @keyframes nebulaPulse { from { opacity: .7; } to { opacity: 1; } }

    .page {
      position: relative;
      z-index: 10;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(16px, 3.5vh, 32px) 16px;
    }

    .creator {
      width: 100%;
      display: flex;
      justify-content: center;
      text-align: center;
    }
    .creator div {
      display: inline-block;
      max-width: 92vw;
      padding: clamp(8px, 2vw, 12px) clamp(14px, 4vw, 24px);
      background: linear-gradient(90deg, rgba(52,152,219,.25), rgba(155,89,182,.25));
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      font-size: clamp(12px, 3.2vw, 15px);
      line-height: 1.4;
      word-wrap: break-word;
      animation: creatorGlow 3s ease-in-out infinite alternate;
      box-shadow: 0 0 20px rgba(155,89,182,.2), 0 0 40px rgba(52,152,219,.1);
    }
    @keyframes creatorGlow {
      from { box-shadow: 0 0 15px rgba(155,89,182,.2), 0 0 30px rgba(52,152,219,.1); }
      to { box-shadow: 0 0 30px rgba(155,89,182,.5), 0 0 60px rgba(52,152,219,.3); }
    }

    .hero {
      text-align: center;
      max-width: 650px;
      width: 100%;
      padding: 0 10px;
    }
    .hero h1 {
      font-size: clamp(26px, 6.5vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #b3d4ff 40%, #d4b3ff 80%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: titleShimmer 5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(155,89,182,.4));
    }
    @keyframes titleShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero p {
      font-size: clamp(14px, 3.8vw, 17px);
      opacity: .85;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      text-shadow: 0 0 20px rgba(100,150,255,.3);
    }
    .buttons {
      margin-top: clamp(18px, 3.5vh, 28px);
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-notes, .btn-help {
      padding: 11px 24px;
      border-radius: 10px;
      font-size: clamp(14px, 3.5vw, 15px);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .btn-notes {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border: none;
      color: white;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(46,204,113,.35);
      animation: btnPulse 2.5s ease-in-out infinite;
    }
    .btn-notes:hover { transform: scale(1.06); color: white; }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(46,204,113,.3); }
      50% { box-shadow: 0 0 35px rgba(46,204,113,.7); }
    }
    .btn-help {
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.3);
      color: white;
      font-weight: 500;
      backdrop-filter: blur(6px);
    }
    .btn-help:hover { background: rgba(255,255,255,.14); color: white; border-color: rgba(255,255,255,.6); }

    .floaters {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(16px, 6vw, 42px);
      padding-bottom: clamp(12px, 3vh, 28px);
      pointer-events: none;
    }
    .float-circle {
      width: clamp(64px, 16vw, 84px);
      height: clamp(64px, 16vw, 84px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: .5px;
      animation: floatUp 6s ease-in-out infinite;
      border: 2px solid rgba(255,255,255,.25);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 25px var(--glow);
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .fc-pink { background: rgba(255,107,214,.35); --glow: rgba(255,107,214,.4); }
    .fc-blue { background: rgba(139,123,255,.35); --glow: rgba(139,123,255,.4); animation-delay: 1.2s; }
    .fc-gold { background: rgba(255,200,61,.35); --glow: rgba(255,200,61,.4); animation-delay: 2.4s; }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-22px) rotate(3deg); }
      60% { transform: translateY(-10px) rotate(-2deg); }
    }
    .shooting-star { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 5; animation: shoot linear forwards; }
    @keyframes shoot { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

<body>
  <div id="intro-overlay" aria-label="Intro video">
    <div id="video-loader" aria-hidden="true"></div>
    <video id="intro-video" muted playsinline webkit-playsinline preload="auto" disablePictureInPicture>
      <source src="gemini_generated_video_8c620d54.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <button id="skip-intro" type="button">
      Skip intro <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
    </button>
  </div>

  <div class="nebula" aria-hidden="true"></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="page">
    <div class="creator">
      <div>
        <i class="fa-solid fa-cog fa-spin" aria-hidden="true"></i>
        This Website is Made By <strong>Ankan Das</strong>
        <i class="fa-solid fa-cog fa-spin fa-spin-reverse" aria-hidden="true"></i>
      </div>
    </div>

    <section class="hero">
      <h1>Welcome to IIT Madras<br>Resource Page</h1>
      <p>Before accessing the notes, please visit the help page and read the instructions carefully.</p>
      <div class="buttons">
        <a class="btn btn-danger" href="https://ankan.pythonanywhere.com/" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-gamepad" style="color: rgb(255, 212, 59);" aria-hidden="true"></i> Game
        </a>
        <a class="btn-notes" href="dashboard.html"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Go To Notes</a>
        <a class="btn-help" href="help.html"><i class="fa-brands fa-hire-a-helper" aria-hidden="true"></i> Help</a>
      </div>
    </section>

    <div class="floaters" aria-hidden="true">
      <div class="float-circle fc-pink">IITM</div>
      <div class="float-circle fc-blue">BS</div>
      <div class="float-circle fc-gold">Resources</div>
    </div>
  </main>

  <script>
    // Background animations start ONLY after intro finishes so phone CPU doesn't lag the video
    let backgroundStarted = false;
    function startBackgroundAnimations() {
      if (backgroundStarted) return;
      backgroundStarted = true;

      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      const stars = [];
      let W = 0, H = 0, t = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function randomStar() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.6 + 0.3,
          baseAlpha: Math.random() * 0.6 + 0.3,
          alpha: 0,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.04 + 0.01,
          color: ['#ffffff', '#cce0ff', '#ffe8cc', '#e0ccff'][Math.floor(Math.random() * 4)]
        };
      }

      for (let i = 0; i < 280; i++) stars.push(randomStar());

      function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 0.016;
        for (const s of stars) {
          s.alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed * 60 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.fill();

          if (s.r > 1.1) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
            ctx.globalAlpha = s.alpha * 0.3;
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();

      function shootingStar() {
        const el = document.createElement('div');
        el.className = 'shooting-star';
        const startX = Math.random() * window.innerWidth * 0.7;
        const startY = Math.random() * window.innerHeight * 0.3;
        const len = 120 + Math.random() * 160;
        const duration = 600 + Math.random() * 800;
        el.style.cssText = `left:${startX}px;top:${startY}px;width:${len}px;height:1.5px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),white 60%,rgba(200,220,255,.9));transform:rotate(${25 + Math.random() * 15}deg);animation:shoot ${duration}ms linear forwards`;
        document.body.appendChild(el);
        window.setTimeout(() => el.remove(), duration + 100);
      }
      window.setInterval(shootingStar, 1800);
      window.setTimeout(() => window.setInterval(shootingStar, 1400), 900);
    }

    // Buffer-aware Intro Video Controller
    (() => {
      const video = document.getElementById('intro-video');
      const overlay = document.getElementById('intro-overlay');
      const loader = document.getElementById('video-loader');
      const skipButton = document.getElementById('skip-intro');
      let dismissed = false;
      let startedPlaying = false;

      function hideIntro() {
        if (dismissed) return;
        dismissed = true;
        overlay.classList.add('is-hidden');
        video.pause();
        startBackgroundAnimations();
        window.setTimeout(() => overlay.remove(), 550);
      }

      function startSmoothPlayback() {
        if (startedPlaying || dismissed) return;
        startedPlaying = true;
        const playPromise = video.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(() => loader.classList.add('hidden'))
            .catch(() => {
              // If mobile battery-saver blocks autoplay, keep loader hidden so user can tap Skip
              loader.classList.add('hidden');
            });
        } else {
          loader.classList.add('hidden');
        }
      }

      // Hide loader whenever video is actively rendering frames, show if mobile network buffers mid-video
      video.addEventListener('playing', () => loader.classList.add('hidden'));
      video.addEventListener('waiting', () => loader.classList.remove('hidden'));

      // Wait until enough of the video is buffered to play smoothly without getting stuck
      if (video.readyState >= 4) {
        startSmoothPlayback();
      } else {
        video.addEventListener('canplaythrough', startSmoothPlayback, { once: true });
        // Fallback: start after 1.2s if on a very slow mobile connection
        window.setTimeout(startSmoothPlayback, 1200);
      }

      video.addEventListener('ended', hideIntro);
      video.addEventListener('error', hideIntro);
      skipButton.addEventListener('click', hideIntro);
    })();
  </script>
</body>
</html>
