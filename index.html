<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07091a">
  <title>IIT Madras Resource Page</title>
  <link rel="icon" type="image/png" href="image/tab.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/df9d548cf6.js" crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { min-height: 100%; }
    body { min-height: 100vh; overflow: hidden; background: #07091a; color: #fff; position: relative; }

    /* Intro video overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #f4f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #intro-overlay.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #intro-video { display: block; width: 100%; height: 100%; object-fit: contain; }
    #skip-intro {
      position: absolute;
      right: 18px;
      bottom: 18px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 8px;
      padding: 8px 14px;
      background: rgba(255,255,255,.85);
      color: #111;
      cursor: pointer;
    }

    #starfield, .nebula { position: fixed; inset: 0; pointer-events: none; }
    #starfield { z-index: 1; }
    .nebula {
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 70%, rgba(111,92,255,.28), transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 30%, rgba(52,152,219,.18), transparent 65%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(155,89,182,.22), transparent 60%);
      animation: nebulaPulse 8s ease-in-out infinite alternate;
    }
    @keyframes nebulaPulse { from { opacity: .7; } to { opacity: 1; } }

    .page {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .creator {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90vw;
      text-align: center;
    }
    .creator div {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(90deg, rgba(52,152,219,.25), rgba(155,89,182,.25));
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      animation: creatorGlow 3s ease-in-out infinite alternate;
      box-shadow: 0 0 20px rgba(155,89,182,.2), 0 0 40px rgba(52,152,219,.1);
    }
    @keyframes creatorGlow {
      from { box-shadow: 0 0 15px rgba(155,89,182,.2), 0 0 30px rgba(52,152,219,.1); }
      to { box-shadow: 0 0 30px rgba(155,89,182,.5), 0 0 60px rgba(52,152,219,.3); }
    }

    .hero { text-align: center; }
    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #fff 0%, #b3d4ff 40%, #d4b3ff 80%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: titleShimmer 5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(155,89,182,.4));
    }
    @keyframes titleShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero p {
      font-size: 17px;
      opacity: .8;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      text-shadow: 0 0 20px rgba(100,150,255,.3);
    }
    .buttons { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-notes, .btn-help {
      padding: 11px 26px;
      border-radius: 10px;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .btn-notes {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border: none;
      color: white;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(46,204,113,.35);
      animation: btnPulse 2.5s ease-in-out infinite;
    }
    .btn-notes:hover { transform: scale(1.06); color: white; }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(46,204,113,.3); }
      50% { box-shadow: 0 0 35px rgba(46,204,113,.7); }
    }
    .btn-help {
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.3);
      color: white;
      font-weight: 500;
      backdrop-filter: blur(6px);
    }
    .btn-help:hover { background: rgba(255,255,255,.14); color: white; border-color: rgba(255,255,255,.6); }

    .floaters { position: absolute; bottom: 80px; left: 0; width: 100%; pointer-events: none; height: 0; }
    .float-circle {
      position: absolute;
      width: 84px; height: 84px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; letter-spacing: .5px;
      animation: floatUp 6s ease-in-out infinite;
      border: 2px solid rgba(255,255,255,.25);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 25px var(--glow);
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .fc-pink { background: rgba(255,107,214,.35); --glow: rgba(255,107,214,.4); left: calc(38% - 42px); }
    .fc-blue { background: rgba(139,123,255,.35); --glow: rgba(139,123,255,.4); left: calc(50% - 42px); animation-delay: 1.2s; }
    .fc-gold { background: rgba(255,200,61,.35); --glow: rgba(255,200,61,.4); left: calc(62% - 42px); animation-delay: 2.4s; }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-28px) rotate(3deg); }
      60% { transform: translateY(-14px) rotate(-2deg); }
    }
    .shooting-star { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 5; animation: shoot linear forwards; }
    @keyframes shoot { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }

    @media (max-width: 600px) {
      .creator { top: 14px; }
      .creator div { padding: 9px 12px; font-size: 12px; }
      .hero p { font-size: 15px; }
      .float-circle { width: 64px; height: 64px; font-size: 11px; }
      .fc-pink { left: calc(30% - 32px); }
      .fc-blue { left: calc(50% - 32px); }
      .fc-gold { left: calc(70% - 32px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

<body>
  <div id="intro-overlay" aria-label="Intro video">
    <video id="intro-video" autoplay muted playsinline preload="auto">
      <source src="gemini_generated_video_8c620d54.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <button id="skip-intro" type="button">Skip intro</button>
  </div>

  <div class="nebula" aria-hidden="true"></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="page">
    <div class="creator">
      <div>
        <i class="fa-solid fa-cog fa-spin" aria-hidden="true"></i>
        This Website is Made By <strong>Ankan Das</strong>
        <i class="fa-solid fa-cog fa-spin fa-spin-reverse" aria-hidden="true"></i>
      </div>
    </div>

    <section class="hero">
      <h1>Welcome to IIT Madras<br>Resource Page</h1>
      <p>Before accessing the notes, please visit the help page and read the instructions carefully.</p>
      <div class="buttons">
        <a class="btn btn-danger" href="https://ankan.pythonanywhere.com/" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-gamepad" style="color: rgb(255, 212, 59);" aria-hidden="true"></i> Game
        </a>
        <a class="btn-notes" href="dashboard.html"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Go To Notes</a>
        <a class="btn-help" href="help.html"><i class="fa-brands fa-hire-a-helper" aria-hidden="true"></i> Help</a>
      </div>
    </section>

    <div class="floaters" aria-hidden="true">
      <div class="float-circle fc-pink">IITM</div>
      <div class="float-circle fc-blue">BS</div>
      <div class="float-circle fc-gold">Resources</div>
    </div>
  </main>

  <script>
    // Intro video: fade away when it ends, fails to load, or the user skips it.
    (() => {
      const video = document.getElementById('intro-video');
      const overlay = document.getElementById('intro-overlay');
      const skipButton = document.getElementById('skip-intro');
      let dismissed = false;

      function hideIntro() {
        if (dismissed) return;
        dismissed = true;
        overlay.classList.add('is-hidden');
        window.setTimeout(() => overlay.remove(), 550);
        video.pause();
      }

      video.addEventListener('ended', hideIntro);
      video.addEventListener('error', hideIntro);
      skipButton.addEventListener('click', hideIntro);

      // Some browsers may block autoplay. Keep the page accessible via Skip intro.
      const playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(() => {
          // The user can still press "Skip intro" if autoplay is blocked.
        });
      }
    })();

    // Animated starfield background.
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    const stars = [];
    let W = 0, H = 0, t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function randomStar() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        alpha: 0,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.04 + 0.01,
        color: ['#ffffff', '#cce0ff', '#ffe8cc', '#e0ccff'][Math.floor(Math.random() * 4)]
      };
    }

    for (let i = 0; i < 280; i++) stars.push(randomStar());

    function draw() {
      ctx.clearRect(0, 0, W, H);
      t += 0.016;
      for (const s of stars) {
        s.alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed * 60 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.fill();

        if (s.r > 1.1) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
          ctx.globalAlpha = s.alpha * 0.3;
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();

    // Occasional shooting stars.
    function shootingStar() {
      const el = document.createElement('div');
      el.className = 'shooting-star';
      const startX = Math.random() * window.innerWidth * 0.7;
      const startY = Math.random() * window.innerHeight * 0.3;
      const len = 120 + Math.random() * 160;
      const duration = 600 + Math.random() * 800;
      el.style.cssText = `left:${startX}px;top:${startY}px;width:${len}px;height:1.5px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),white 60%,rgba(200,220,255,.9));transform:rotate(${25 + Math.random() * 15}deg);animation:shoot ${duration}ms linear forwards`;
      document.body.appendChild(el);
      window.setTimeout(() => el.remove(), duration + 100);
    }
    window.setInterval(shootingStar, 1800);
    window.setTimeout(() => window.setInterval(shootingStar, 1400), 900);
  </script>
</body>
</html>
