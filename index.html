<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>IIT Madras Resource Page</title>
  <link rel="icon" type="image/png" href="image/tab.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/df9d548cf6.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      background: #07091a;
      color: white;
      position: relative;
      min-height: 100vh;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none
    }

    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 30% 70%, rgba(111, 92, 255, 0.28) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 30%, rgba(52, 152, 219, 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(155, 89, 182, 0.22) 0%, transparent 60%);
      animation: nebulaPulse 8s ease-in-out infinite alternate;
    }

    @keyframes nebulaPulse {
      from {
        opacity: 0.7
      }

      to {
        opacity: 1
      }
    }

    .page {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .creator {
      text-align: center;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90vw
    }

    .creator div {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(90deg, rgba(52, 152, 219, 0.25), rgba(155, 89, 182, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      animation: creatorGlow 3s ease-in-out infinite alternate;
      box-shadow: 0 0 20px rgba(155, 89, 182, 0.2), 0 0 40px rgba(52, 152, 219, 0.1);
    }

    @keyframes creatorGlow {
      from {
        box-shadow: 0 0 15px rgba(155, 89, 182, 0.2), 0 0 30px rgba(52, 152, 219, 0.1)
      }

      to {
        box-shadow: 0 0 30px rgba(155, 89, 182, 0.5), 0 0 60px rgba(52, 152, 219, 0.3)
      }
    }

    .hero {
      text-align: center;
      padding-top: 0
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #b3d4ff 40%, #d4b3ff 80%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: titleShimmer 5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.4));
    }

    @keyframes titleShimmer {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .hero p {
      font-size: 17px;
      opacity: 0.8;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.3)
    }

    .buttons {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .btn-notes {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border: none;
      color: white;
      padding: 11px 26px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.35);
      animation: btnPulse 2.5s ease-in-out infinite;
      transition: transform 0.2s;
    }

    .btn-notes:hover {
      transform: scale(1.06);
      color: white
    }

    @keyframes btnPulse {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(46, 204, 113, 0.3)
      }

      50% {
        box-shadow: 0 0 35px rgba(46, 204, 113, 0.7)
      }
    }

    .btn-help {
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 11px 26px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }

    .btn-help:hover {
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border-color: rgba(255, 255, 255, 0.6)
    }

    .floaters {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      pointer-events: none;
      height: 0
    }

    .float-circle {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      animation: floatUp 6s ease-in-out infinite;
      border: 2px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 25px var(--glow);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .fc-pink {
      background: rgba(255, 107, 214, 0.35);
      --glow: rgba(255, 107, 214, 0.4);
      left: calc(38% - 42px);
      animation-delay: 0s
    }

    .fc-blue {
      background: rgba(139, 123, 255, 0.35);
      --glow: rgba(139, 123, 255, 0.4);
      left: calc(50% - 42px);
      animation-delay: 1.2s
    }

    .fc-gold {
      background: rgba(255, 200, 61, 0.35);
      --glow: rgba(255, 200, 61, 0.4);
      left: calc(62% - 42px);
      animation-delay: 2.4s
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg)
      }

      30% {
        transform: translateY(-28px) rotate(3deg)
      }

      60% {
        transform: translateY(-14px) rotate(-2deg)
      }

      100% {
        transform: translateY(0) rotate(0deg)
      }
    }

    .shooting-star {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
      animation: shoot linear forwards;
    }

    @keyframes shoot {
      0% {
        opacity: 1
      }

      80% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }
  </style>
</head>

<body>
  <div class="nebula"></div>
  <canvas id="starfield"></canvas>

  <div class="page">
    <div class="creator">
      <div>
        <i class="fa-solid fa-cog fa-spin"></i>
        This Website is Made By <strong>Ankan Das</strong>
        <i class="fa-solid fa-cog fa-spin fa-spin-reverse"></i>
      </div>
    </div>

    <section class="hero">
      <h1>Welcome to IIT Madras<br>Resource Page</h1>
      <p>Before accessing the notes, please visit the help page and read the instructions carefully.</p>
      <div class="buttons">
        <a class="btn btn-danger"  href="https://ankan.pythonanywhere.com/" target="_blank"><i class="fa-solid fa-gamepad" style="color: rgb(255, 212, 59);"></i>  Game</a>
        <a class="btn-notes" href="dashboard.html"><i class="fa-solid fa-book-open"></i> Go To Notes</a>
        <a class="btn-help" href="help.html"><i class="fa-brands fa-hire-a-helper"></i> Help</a>
      </div>
    </section>

    <div class="floaters">
      <div class="float-circle fc-pink">IITM</div>
      <div class="float-circle fc-blue">BS</div>
      <div class="float-circle fc-gold">Resources</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function randomStar() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        alpha: 0,
        speed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.04 + 0.01,
        color: ['#ffffff', '#cce0ff', '#ffe8cc', '#e0ccff'][Math.floor(Math.random() * 4)]
      };
    }

    for (let i = 0; i < 280; i++) stars.push(randomStar());

    let t = 0;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      t += 0.016;
      stars.forEach(s => {
        s.alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed * 60 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.fill();
        if (s.r > 1.1) {
          ctx.beginPath();
          ctx.globalAlpha = s.alpha * 0.3;
          ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();

    function shootingStar() {
      const el = document.createElement('div');
      el.className = 'shooting-star';
      const startX = Math.random() * window.innerWidth * 0.7;
      const startY = Math.random() * window.innerHeight * 0.3;
      const len = 120 + Math.random() * 160;
      const dur = 600 + Math.random() * 800;
      el.style.cssText = `left:${startX}px;top:${startY}px;
    width:${len}px;height:1.5px;border-radius:1px;
    background:linear-gradient(90deg,rgba(255,255,255,0),white 60%,rgba(200,220,255,0.9));
    transform:rotate(${25 + Math.random() * 15}deg);
    animation:shoot ${dur}ms linear forwards`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur + 100);
    }

    setInterval(shootingStar, 1800);
    setTimeout(() => setInterval(shootingStar, 1400), 900);
  </script>
</body>

</html>
