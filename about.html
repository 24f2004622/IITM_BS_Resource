<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ankan Notes Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            background: linear-gradient(135deg,#141e30,#243b55);
            overflow-x:hidden;
            color:white;
        }

        /* Navbar */
        .navbar{
            width:100%;
            padding:20px;
            display:flex;
            justify-content:flex-start;
        }

        .home-btn{
            text-decoration:none;
            background:linear-gradient(45deg,#00c6ff,#0072ff);
            color:white;
            padding:12px 22px;
            border-radius:30px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
        }

        .home-btn:hover{
            transform:scale(1.08);
            background:linear-gradient(45deg,#ff512f,#dd2476);
        }

        /* Moving Balls */
        .ball{
            width:60px;
            height:60px;
            border-radius:50%;
            position:relative;
            animation:moveRight 4s linear infinite;
            background:linear-gradient(45deg,#00f260,#0575e6);
            box-shadow:0 0 20px rgba(255,255,255,0.5);
        }

        .ball.reverse{
            animation-direction:reverse;
            background:linear-gradient(45deg,#fc466b,#3f5efb);
        }

        @keyframes moveRight{
            from{
                left:0;
            }
            to{
                left:calc(100% - 60px);
            }
        }

        /* Title Box */
        .title-box{
            width:90%;
            max-width:700px;
            margin:30px auto;
            padding:25px;
            border-radius:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
            animation:glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                box-shadow:0 0 15px #00c6ff;
            }
            to{
                box-shadow:0 0 30px #ff00ff;
            }
        }

        /* Card */
        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px 15px;
        }

        .card{
            width:100%;
            max-width:350px;
            background:rgba(255,255,255,0.12);
            border-radius:25px;
            overflow:hidden;
            backdrop-filter:blur(12px);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-10px) scale(1.02);
        }

        .card img{
            width:100%;
            height:320px;
            object-fit:cover;
        }

        .card-body{
            padding:25px;
        }

        .card-text{
            font-size:17px;
            line-height:1.7;
            text-align:justify;
            color:#f1f1f1;
        }

        /* Responsive */
        @media(max-width:600px){

            .title-box{
                font-size:22px;
                padding:18px;
            }

            .card img{
                height:250px;
            }

            .card-text{
                font-size:15px;
            }

            .ball{
                width:45px;
                height:45px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="dashboard.html" class="home-btn">🏠 Go To Home Page</a>
    </div>

    <!-- Top Ball -->
    <div class="ball"></div>

    <!-- Title -->
    <div class="title-box">
        ✨ This Website is Made By Ankan Das ✨
    </div>

    <!-- Bottom Ball -->
    <div class="ball reverse"></div>

    <!-- Card Section -->
    <div class="container">

        <div class="card">

            <img src="image/img_1.png" alt="photo">

            <div class="card-body">

                <p class="card-text">
                    <center><b>Ankan[IITM]</b></center>
                    <i>(Web Developer & Game Developer)</i>
                    <br>
                    <br>
                    <br>
                    Hi everyone! I hope all of you are doing well.
                    This website is specially made for students who
                    search for notes before exams and want to make
                    their preparation stronger and easier.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
